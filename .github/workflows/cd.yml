name: "CD - Deploy to Minikube"

on:
  workflow_run:
    workflows: ["CI - Train, Test and Build"]
    branches: [main]
    types:
      - completed

jobs:
  deploy:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: self-hosted
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Add Minikube and Kubectl to PATH
        run: echo "C:\minikube" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Download trained models artifact
        uses: actions/download-artifact@v4
        with:
          name: trained-models
          path: models/
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Docker image locally
        run: |
          if (Test-Path "models/scaler.pkl") { Copy-Item "models/scaler.pkl" -Destination "scaler.pkl" -ErrorAction SilentlyContinue } else { New-Item "scaler.pkl" -ItemType File -Force | Out-Null }
          docker build -t intrusion-detection:${{ github.event.workflow_run.head_sha }} .
          docker tag intrusion-detection:${{ github.event.workflow_run.head_sha }} intrusion-detection:latest

      - name: Load image into Minikube
        run: minikube image load intrusion-detection:${{ github.event.workflow_run.head_sha }}

      - name: Update image tag in deployment.yaml
        run: (Get-Content k8s/deployment.yaml) -replace "intrusion-detection:latest", "intrusion-detection:${{ github.event.workflow_run.head_sha }}" | Set-Content k8s/deployment.yaml

      - name: Deploy to Minikube
        run: |
          kubectl apply -f k8s/deployment.yaml
          kubectl apply -f k8s/service.yaml

      - name: Wait for deployment rollout
        run: kubectl rollout status deployment/intrusion-detection --timeout=180s

      - name: Automated Background Port-Forward
        run: |
          # Kill any existing port-forwards to avoid "address already in type" errors
          Stop-Process -Name "kubectl" -ErrorAction SilentlyContinue
          # Start a new background tunnel that survives the runner's completion
          Start-Process kubectl -ArgumentList "port-forward svc/intrusion-detection-svc 8501:8501" -NoNewWindow
          # Give it a few seconds to initialize
          Sleep 5

      - name: Print Minikube service URL
        run: echo "Tunnel is now running in your PC's background. Dashboard is live at http://localhost:8501"

      - name: Generate Clickable Summary
        run: |
          $summary = @"
          ###  Deployment Successful!
          The Network Intrusion Dashboard has been deployed to your local Kubernetes cluster.
          
          **Access your Dashboard here:**
          [http://localhost:8501](http://localhost:8501)
          
          > **Note:** Ensure you have the port-forward running in your terminal:
          > ``kubectl port-forward svc/intrusion-detection-svc 8501:8501``
          "@
          $summary | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Encoding utf8 -Append

      - name: CD complete
        run: |
          echo "Local deployment complete. Click the link in the job summary!"

      # Note: This requires a self-hosted runner with Minikube installed.
