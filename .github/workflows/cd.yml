name: "CD - Deploy to Minikube"

on:
  workflow_run:
    workflows: ["CI - Train, Test and Build"]
    branches: [main]
    types:
      - completed

jobs:
  deploy:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: self-hosted
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Add Minikube and Kubectl to PATH
        run: echo "C:\minikube" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Download trained models artifact
        uses: actions/download-artifact@v4
        with:
          name: trained-models
          path: models/
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Docker image locally
        run: |
          if (Test-Path "models/scaler.pkl") { Copy-Item "models/scaler.pkl" -Destination "scaler.pkl" -ErrorAction SilentlyContinue } else { New-Item "scaler.pkl" -ItemType File -Force | Out-Null }
          docker build -t intrusion-detection:${{ github.event.workflow_run.head_sha }} .
          docker tag intrusion-detection:${{ github.event.workflow_run.head_sha }} intrusion-detection:latest

      - name: Load image into Minikube
        run: minikube image load intrusion-detection:${{ github.event.workflow_run.head_sha }}

      - name: Update image tag in deployment.yaml
        run: (Get-Content k8s/deployment.yaml) -replace "intrusion-detection:latest", "intrusion-detection:${{ github.event.workflow_run.head_sha }}" | Set-Content k8s/deployment.yaml

      - name: Deploy to Minikube
        run: |
          kubectl apply -f k8s/deployment.yaml
          kubectl apply -f k8s/service.yaml

      - name: Wait for deployment rollout
        run: kubectl rollout status deployment/intrusion-detection --timeout=180s

      - name: Print Minikube service URL
        run: echo "Run 'minikube service intrusion-detection-svc' in your local terminal to access the dashboard!"

      - name: CD complete
        run: |
          echo "Local deployment complete"
          echo "App on Minikube: run 'minikube service intrusion-detection-svc --url'"

      # Note: This requires a self-hosted runner with Minikube installed.
