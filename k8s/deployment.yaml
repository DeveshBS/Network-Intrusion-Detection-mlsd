apiVersion: apps/v1
kind: Deployment
metadata:
  name: intrusion-detection
  labels:
    app: intrusion-detection
spec:
  replicas: 2
  selector:
    matchLabels:
      app: intrusion-detection
  template:
    metadata:
      labels:
        app: intrusion-detection
    spec:
      containers:
      - name: intrusion-detection
        image: intrusion-detection:latest
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8501
        resources:
          limits:
            memory: "512Mi"
            cpu: "500m"
          requests:
            memory: "256Mi"
            cpu: "250m"
        livenessProbe:
          httpGet:
            path: /_stcore/health
            port: 8501
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /_stcore/health
            port: 8501
          initialDelaySeconds: 10
          periodSeconds: 5
